<script>
    async function checkData() {
        const emptyWeight = 5; // Aquí pon el valor configurado
        const fullWeight = 10; // Aquí pon el valor configurado
        
        const url = `/api/weight-data?clientCode=CLI3U0KM7I1&scaleCode=BSCWSBNSJBD&empty_weight=${emptyWeight}&full_weight=${fullWeight}&t=${Date.now()}`;
        
        const response = await fetch(url);
        const data = await response.json();
        
        console.log('Datos recibidos:', data);
        // Aquí actualiza el UI usando data.data.current para mostrar peso, neto, % gas
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        checkData();
        setInterval(checkData, 10000);
    });
</script>
